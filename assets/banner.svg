<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Guess Who: AI or Real?</title>
  <desc id="d">Banner showing a row of portrait cards, some with question marks, for the Guess Who AI or Real community voting game.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- sparkles -->
  <g fill="#fde68a" opacity="0.85">
    <path d="M120 60 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z"/>
    <path d="M1060 50 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"/>
    <path d="M980 300 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
  </g>

  <!-- cards -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150,110) rotate(-8)">
      <rect width="160" height="200" rx="16" fill="url(#card)"/>
      <rect x="14" y="14" width="132" height="130" rx="10" fill="url(#face)"/>
      <circle cx="80" cy="66" r="26" fill="#f8fafc" opacity="0.9"/>
      <path d="M36 128 q44 -56 88 0z" fill="#f8fafc" opacity="0.9"/>
      <text x="80" y="176" font-size="18" font-weight="700" fill="#0f172a">🤖 AI?</text>
    </g>
    <g transform="translate(360,80)">
      <rect width="180" height="220" rx="18" fill="url(#card)"/>
      <rect x="16" y="16" width="148" height="150" rx="12" fill="#334155"/>
      <text x="90" y="118" font-size="72" font-weight="800" fill="#fde68a">?</text>
      <text x="90" y="196" font-size="20" font-weight="700" fill="#0f172a">Who is it?</text>
    </g>
    <g transform="translate(590,70)">
      <rect width="200" height="240" rx="20" fill="#f8fafc" stroke="#fbbf24" stroke-width="5"/>
      <rect x="18" y="18" width="164" height="170" rx="14" fill="url(#face)"/>
      <circle cx="100" cy="82" r="32" fill="#f8fafc" opacity="0.9"/>
      <path d="M48 150 q52 -66 104 0z" fill="#f8fafc" opacity="0.9"/>
      <text x="100" y="222" font-size="22" font-weight="800" fill="#0f172a">🏆 Vote!</text>
    </g>
    <g transform="translate(850,110) rotate(8)">
      <rect width="160" height="200" rx="16" fill="url(#card)"/>
      <rect x="14" y="14" width="132" height="130" rx="10" fill="#334155"/>
      <text x="80" y="108" font-size="56" font-weight="800" fill="#fde68a">?</text>
      <text x="80" y="176" font-size="18" font-weight="700" fill="#0f172a">🙋 Real?</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="58" font-size="46" font-weight="800" fill="#f8fafc">Guess Who: AI or Real?</text>
    <text x="600" y="92" font-size="20" fill="#a5f3fc">🎭 Can the crowd spot the machine? 🧠</text>
  </g>
</svg>
